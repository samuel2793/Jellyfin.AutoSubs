<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><title>AutoSubs</title></head>
<body>
  <div id="autoSubsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
      <div class="content-primary">
        <h2>AutoSubs</h2>
        <p>Find subtitles with arbitrary names in movie folders and subfolders. Create relative symlinks next to the video, without moving originals. Movies with multiple video files in the same folder are skipped.</p>
        <form id="autoSubsConfigForm">
          <div class="inputContainer">
            <label for="autoSubsEnabled" style="display:flex;align-items:center;gap:0.65rem;cursor:pointer;">
              <input id="autoSubsEnabled" type="checkbox" style="appearance:auto;width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:#00a4dc;"/>
              <span>Enabled</span>
            </label>
          </div>
          <div class="inputContainer">
            <label for="autoSubsDryRun" style="display:flex;align-items:center;gap:0.65rem;cursor:pointer;">
              <input id="autoSubsDryRun" type="checkbox" style="appearance:auto;width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:#00a4dc;"/>
              <span>Dry run (log only; create no links)</span>
            </label>
          </div>
          <div class="inputContainer">
            <label class="inputLabel" for="autoSubsMaxDepth">Maximum directory depth</label>
            <input id="autoSubsMaxDepth" type="number" min="1" max="30" class="emby-input"/>
          </div>
          <button id="autoSubsSave" type="submit" class="raised button-submit block emby-button"><span>Save</span></button>
          <p id="autoSubsStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
    <script type="text/javascript">
      (function () {
        'use strict';
        var page = document.querySelector('#autoSubsConfigPage');
        if (!page) return;

        var pluginId = '746a7eb3-42b6-46b1-98cb-14f02d5ac22b';
        var enabled = page.querySelector('#autoSubsEnabled');
        var dryRun = page.querySelector('#autoSubsDryRun');
        var depth = page.querySelector('#autoSubsMaxDepth');
        var save = page.querySelector('#autoSubsSave');
        var status = page.querySelector('#autoSubsStatus');

        function setStatus(message, error) {
          status.textContent = message;
          status.style.color = error ? '#e88' : 'inherit';
        }

        async function loadSettings() {
          try {
            var config = await ApiClient.getPluginConfiguration(pluginId);
            enabled.checked = Boolean(config.Enabled);
            dryRun.checked = Boolean(config.DryRun);
            depth.value = config.MaxDepth == null ? 12 : config.MaxDepth;
            setStatus('', false);
          } catch (error) {
            console.error('AutoSubs configuration load failed:', error);
            setStatus('Could not load AutoSubs settings. See browser console.', true);
          }
        }

        page.addEventListener('pageshow', loadSettings);
        page.querySelector('#autoSubsConfigForm').addEventListener('submit', async function (event) {
          event.preventDefault();
          save.disabled = true;
          setStatus('Saving...', false);
          try {
            var config = await ApiClient.getPluginConfiguration(pluginId);
            config.Enabled = enabled.checked;
            config.DryRun = dryRun.checked;
            config.MaxDepth = Math.max(1, Math.min(30, Number(depth.value) || 12));
            await ApiClient.updatePluginConfiguration(pluginId, config);
            setStatus('Settings saved.', false);
          } catch (error) {
            console.error('AutoSubs configuration save failed:', error);
            setStatus('Could not save AutoSubs settings. See browser console.', true);
          } finally {
            save.disabled = false;
          }
        });
      })();
    </script>
  </div>
</body>
</html>
